
name: Create Final Version

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  create-final-version:
    if: github.ref != 'refs/heads/final'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          MESSAGE="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ "$MESSAGE" =~ ^final\ (v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Version detected: ${BASH_REMATCH[1]}"
          else
            echo "No final version found."
          fi

      - name: Create branch and tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create or update the final branch
          git branch -f final "$SHA"
          git push origin final --force

          # Create a version tag; never overwrite an existing tag
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          git tag "$VERSION" "$SHA"
          git push origin "$VERSION"
